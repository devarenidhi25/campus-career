# ==============================================================================
# Nginx Virtual Host Configuration for CampusCareer
# Optimized for high-performance static asset delivery & caching
# ==============================================================================

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Enable Gzip Compression for fast load times
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 256;

    # Clean URLs & Fallback to Index
    location / {
        try_files $uri $uri/ $uri.html /index.html;
    }

    # Cache static CSS, JS, and font assets
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-XSS-Protection "1; mode=block";
    add_header X-Content-Type-Options "nosniff";

    # Custom 404 Error Page Fallback
    error_page 404 /index.html;
}
